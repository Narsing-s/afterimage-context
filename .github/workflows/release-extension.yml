name: Package browser extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'extension-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package extension
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/afterimage-browser-extension-${GITHUB_REF_NAME}.zip .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: afterimage-browser-extension
          path: dist/*.zip

      - name: Create GitHub release for tagged builds
        if: startsWith(github.ref, 'refs/tags/extension-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
