name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Evaluate contextual relevance
        run: node scripts/afterimage-evaluate.mjs
      - name: Check local storage contract
        run: node scripts/afterimage-storage-check.mjs
      - name: Check memory quality rules
        run: node scripts/afterimage-memory-quality.mjs
      - name: Check portable memory format
        run: node scripts/afterimage-memory-format-check.mjs
      - name: Check memory health rules
        run: node scripts/afterimage-memory-health-check.mjs
      - name: Check memory intelligence rules
        run: node scripts/afterimage-memory-intelligence-check.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run browser smoke test
        run: npx playwright test
